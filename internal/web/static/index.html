<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>公众号助手</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <div class="brand-mark" aria-hidden="true">文</div>
    <h1>公众号助手</h1>
    <p class="muted">管理草稿与素材，预览并发布文章</p>
    <label for="token-input">访问令牌</label>
    <input id="token-input" type="password" autocomplete="current-password" placeholder="wxt_…" required>
    <label class="check"><input id="remember" type="checkbox"> 在此设备上保持登录</label>
    <button type="submit" class="btn primary block">登录</button>
    <p id="login-err" class="form-err" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/drafts"><span class="brand-mark sm" aria-hidden="true">文</span><span>公众号助手</span></a>
      <nav class="nav" aria-label="主导航">
        <a href="#/drafts" data-nav="drafts">草稿</a>
        <a href="#/materials/image" data-nav="materials">素材</a>
      </nav>
      <div class="account">
        <span id="account-name" class="account-name"></span>
        <button id="logout" class="btn ghost sm" type="button">退出</button>
      </div>
    </div>
  </header>
  <main id="view" class="container" tabindex="-1"></main>
</div>

<dialog id="confirm" class="dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <div class="dialog-actions">
      <button value="cancel" class="btn">取消</button>
      <button value="ok" id="confirm-ok" class="btn primary">确定</button>
    </div>
  </form>
</dialog>

<dialog id="viewer" class="dialog viewer" aria-label="素材详情"></dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
